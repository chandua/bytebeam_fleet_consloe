import org.apache.tools.ant.taskdefs.condition.Os

group 'com.tigereye.duckdb_libs'
version '2.1.0'

buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 35
    namespace 'com.tigereye.duckdb_libs'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21 //current flutter min sdk version

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
}

def jniLibsDir = "$projectDir/src/main/jniLibs"

// Upstream 1.4.1/1.4.4 Android assets 404; v1.4.2 publishes the .so zips.
def duckDbRelease = 'v1.4.2'
def zipFiles = [
    'arm64-v8a': "https://github.com/TigerEyeLabs/duckdb-dart/releases/download/${duckDbRelease}/libduckdb-android_arm64-v8a.zip",
    'armeabi-v7a': "https://github.com/TigerEyeLabs/duckdb-dart/releases/download/${duckDbRelease}/libduckdb-android_armeabi-v7a.zip"
]

task downloadAndExtractDuckDB {
    doLast {
        zipFiles.each { abi, url ->
            def libDir = file("$jniLibsDir/$abi")
            def libFile = file("$libDir/libduckdb.so")
            if (libFile.exists() && libFile.length() > 1024) {
                println "Library for $abi already exists, skipping download"
                return
            }

            def tmpDir = file("$buildDir/tmp")
            tmpDir.mkdirs()
            def zipFile = file("$tmpDir/duckdb-${abi}.zip")
            libDir.mkdirs()

            println "Downloading $url"
            def lastError = null
            for (int attempt = 1; attempt <= 3; attempt++) {
                try {
                    def connection = new URL(url).openConnection()
                    connection.setConnectTimeout(30_000)
                    connection.setReadTimeout(300_000)
                    connection.instanceFollowRedirects = true
                    connection.inputStream.withStream { i ->
                        zipFile.withOutputStream { it << i }
                    }
                    lastError = null
                    break
                } catch (Exception e) {
                    lastError = e
                    println "Download attempt $attempt failed for $abi: ${e.message}"
                    if (zipFile.exists()) zipFile.delete()
                    if (attempt < 3) sleep(2000)
                }
            }
            if (lastError != null) {
                throw new GradleException(
                    "Failed to download DuckDB for $abi after 3 attempts from $url. " +
                    "Place libduckdb.so in android/src/main/jniLibs/$abi/ manually. Cause: ${lastError.message}",
                    lastError
                )
            }
            if (zipFile.length() < 1024) {
                zipFile.delete()
                throw new GradleException("DuckDB download for $abi looks invalid (HTTP body too small) from $url")
            }

            println "Extracting to $libDir"
            copy {
                from zipTree(zipFile)
                into libDir
                include "*.so"
            }
            delete zipFile

            if (!libFile.exists()) {
                throw new GradleException("libduckdb.so missing after extract for $abi")
            }
        }
    }
}

preBuild.dependsOn downloadAndExtractDuckDB
